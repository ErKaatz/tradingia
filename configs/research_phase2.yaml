symbol: BTCUSDT
timeframe: 1h
final_holdout_start: "2025-01-01"
allow_final_holdout_evaluation: false
allow_data_gaps: true  # Binance BTCUSDT 1h has a documented historical gap; never silently fill it.
capital:
  initial: 10000
fees:
  trading_fee: 0.001
  slippage: 0.0002
position_size_fraction: 1.0

families:
  sma_cross:
    parameter_study:
      fast: [10, 20, 50]
      slow: [50, 100, 200]
  momentum:
    parameter_study:
      lookback: [12, 24, 48, 72, 168]
  mean_reversion:
    parameter_study:
      rsi_period: [7, 14, 21]
      oversold: [20, 30]
      exit_rsi: [50, 60]
  breakout:
    parameter_study:
      entry_lookback: [24, 48, 96, 168]
      exit_lookback: [12, 24, 48]

walk_forward:
  train_months: 24
  evaluation_months: 6
monte_carlo:
  simulations: 1000
  seed: 42
