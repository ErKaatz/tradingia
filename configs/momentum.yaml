strategy: momentum

symbol: BTCUSDT
timeframe: 1h

start: "2023-01-01"
end: "2024-01-01"

capital:
  initial: 10000

fees:
  trading_fee: 0.001
  slippage: 0.0002

strategy_params:
  lookback: 24

data_split:
  train: 0.6
  validation: 0.2
  test: 0.2

# Known data issue: Binance's public REST API is missing exactly one candle
# (2023-03-24 13:00 UTC) in this date range — confirmed directly against the
# API, not a bug in our downloader/cache. Explicitly allowing this single
# documented gap rather than silently rejecting it or fabricating a candle.
# See RESEARCH_RULES.md and README.md for the gap-detection policy.
allow_data_gaps: true
